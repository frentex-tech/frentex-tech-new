- main:
  - text: FRENTEX / INTEGRATION
  - heading "Integrations & custom systems" [level=1]
  - paragraph: API integrations, internal portals, dashboards, data synchronization and process automation.
  - article:
    - heading "When does it fit?" [level=3]
    - paragraph: When the same data is entered more than once, or decisions are delayed because your systems don't agree.
  - article:
    - heading "What can we build?" [level=3]
    - paragraph: API integrations, internal portals, dashboards, data synchronization and process automation.
  - article:
    - heading "Deliverables we agree on" [level=3]
    - paragraph: A systems map; data-exchange specifications; error handling and retries; integration tests; documentation.
  - article:
    - heading "What we define with your team first" [level=3]
    - paragraph: API availability, usage limits, which source is authoritative, synchronization rules and the environments we may access.
  - heading "Clarity before you commit." [level=2]
  - paragraph: The technical proposal sets out the release scope, exclusions, cost, schedule and acceptance criteria. Any additional requirement is assessed for its impact and approved before it is implemented.
