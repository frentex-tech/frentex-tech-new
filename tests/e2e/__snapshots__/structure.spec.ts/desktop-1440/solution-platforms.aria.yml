- main:
  - text: FRENTEX / PLATFORMS
  - heading "المواقع وبوابات الأعمال" [level=1]
  - paragraph: مواقع مؤسسية متعددة اللغات، بوابات عملاء وشركاء، منصات خدمات وإدارة محتوى.
  - article:
    - heading "متى يكون الحل مناسبًا؟" [level=3]
    - paragraph: عندما يحتاج عملاؤك أو شركاؤك إلى إنجاز طلباتهم ومتابعتها بدل تبادل الرسائل.
  - article:
    - heading "ما الذي يمكن أن نبنيه؟" [level=3]
    - paragraph: مواقع مؤسسية متعددة اللغات، بوابات عملاء وشركاء، منصات خدمات وإدارة محتوى.
  - article:
    - heading "مخرجات نتفق عليها" [level=3]
    - paragraph: خريطة رحلات المستخدم؛ تصميم واجهات؛ إدارة محتوى؛ ربط الأنظمة المتفق عليها؛ توثيق وتسليم.
  - article:
    - heading "ما نحدده مع فريقك أولًا" [level=3]
    - paragraph: الهوية والمحتوى، أنواع المستخدمين، صلاحيات الوصول، التكاملات، ومعايير سرعة وإتاحة الصفحات.
  - heading "قرار الشراء يبدأ بوضوح." [level=2]
  - paragraph: يحدد العرض الفني نطاق الإصدار والاستثناءات والتكلفة والجدول ومعايير القبول. أي متطلبات إضافية تخضع لتقييم أثرها واعتمادها قبل التنفيذ.
