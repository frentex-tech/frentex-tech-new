- main:
  - text: ABOUT FRENTEX TECH
  - heading "التقنية في خدمة العمل الذي تبنيه." [level=1]
  - paragraph: Frentex Tech شركة برمجيات في السعودية، تطوّر مواقع وتطبيقات وأنظمة أعمال وتكاملات للشركات والمؤسسات.
  - article:
    - heading "من نخدم" [level=3]
    - paragraph: نركز على المؤسسات والشركات الكبيرة، ونتعاون أيضًا مع المنشآت المتنامية والشركات الناشئة التي تحتاج شريكًا تقنيًا لتطوير منتجاتها.
  - article:
    - heading "كيف نفكر" [level=3]
    - paragraph: نبدأ بالإجراء الذي يحتاج إلى تحسين والنتيجة المطلوب الوصول إليها. ثم نختار حلًا يناسب السياق، سواء كان بناءً مخصصًا أو تهيئة وربط أدوات قائمة.
  - article:
    - heading "العربية جزء من التجربة" [level=3]
    - paragraph: نهتم بالواجهات العربية واتجاه القراءة وتناسق المحتوى ومسارات المستخدم، مع دعم الإنجليزية وفق متطلبات المشروع.
  - article:
    - heading "الثقة في التفاصيل" [level=3]
    - paragraph: نوضح ما يشمله العمل وما يحتاج إلى اعتماد، ونوثق قرارات التنفيذ والتسليم. النماذج المنشورة تجارب أصلية لشرح القدرات، وليست ادعاءً بمشاريع عملاء.
  - heading "نبدأ من تحدّي العمل." [level=2]
  - paragraph: شاركنا الإجراء الحالي، الفرق المعنية، والنتيجة المطلوبة. منها نحدد الخطوة المناسبة.
