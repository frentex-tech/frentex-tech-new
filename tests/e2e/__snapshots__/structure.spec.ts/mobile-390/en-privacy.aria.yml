  - heading "The project summary and demos" [level=2]
  - paragraph: The interactive demos and the project summary run in your browser. This website does not send what you enter to a company server, and does not keep it after you reload the page. The file you download stays on your device.
  - heading "Contact and external links" [level=2]
  - paragraph: When you open WhatsApp or make a phone call, you move to the service you chose, and its policies apply to your use of it. Share only the information needed to start the conversation, and avoid sending confidential or sensitive data in the initial summary.
  - heading "Hosting" [level=2]
  - paragraph:
    - text: The website is hosted on GitHub Pages. The hosting provider may process technical connection information under its own policy. We do not add advertising or analytics tools to this version, and the fonts are hosted with the website.
