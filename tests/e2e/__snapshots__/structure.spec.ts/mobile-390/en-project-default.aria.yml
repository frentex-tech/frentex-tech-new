  - status
  - paragraph: The demo runs on sample data within the page. There is no database, no accounts and no messages to customers. Reloading restores the original state.
  - text: The challenge
  - heading "Why this demo?" [level=2]
  - paragraph: When customer follow-up moves between separate chats and spreadsheets, it is hard to know what is waiting for a reply and what has reached an agreement. We designed Madar to make each opportunity's status and next step visible to the team.
  - text: The solution idea
  - heading "Details that make work easier." [level=2]
  - paragraph: "A board with three simple stages: New opportunity, Proposal sent and Agreed. Each card has a title and a next activity. Search reduces clutter, and moving a card shows the change of status immediately."
  - text: What we built here
  - heading "An experience you can explore." [level=2]
  - list:
    - listitem: Designed for Arabic right-to-left reading, and available in English.
    - listitem: Instant search across opportunities, and moving them forward or back.
    - listitem: Live opportunity counts for each stage, and messages that confirm each action.
  - text: From demo to product
  - paragraph: A real product requires defining business requirements, accounts and permissions, data storage, integrations and testing with real users. We define that scope before committing to implementation.
  - text: Next demo
