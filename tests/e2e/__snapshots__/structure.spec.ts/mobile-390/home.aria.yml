  - text: عن فرينتكس
  - heading "قريبون من السياق. دقيقون في التفاصيل." [level=2]:
    - text: ""
    - emphasis: دقيقون في التفاصيل.
  - paragraph: "Frentex Tech، شركة برمجيات في السعودية تجمع تصميم التجربة وهندسة البرمجيات تحت فكرة واحدة: أن تعمل أجزاء التقنية معًا، في خدمة العمل."
  - paragraph: نهتم بما يراه المستخدم، وما يحدث خلف الواجهة أيضًا. نختار الحل بناءً على الاحتياج، ونترك قرارات التنفيذ ومخرجات المراحل واضحة وقابلة للنقاش.
  - link "المزيد عن فرينتكس":
    - /url: /about
  - text: العربية في قلب التجربة العربية جزء من التجربة حلول بحجم الاحتياج كيف نفكر وضوح في التسليم الثقة في التفاصيل مختبر فرينتكس
  - heading "شاهد الفكرة. ثم جرّبها بنفسك." [level=2]
  - paragraph: نماذج أصلية صمّمناها وطوّرنا تفاعلاتها لهذه النسخة. كل نموذج يشرح مشكلة وحلًا، ويتيح تجربة جزء من رحلة المستخدم.
