  - heading "معلومات واضحة عن استخدام الموقع." [level=1]
  - paragraph: "/آخر تحديث: \\d+ أكتوبر \\d+/"
  - heading "الملخص والنماذج" [level=2]
  - paragraph: تعمل النماذج التفاعلية وملخص المشروع داخل متصفحك. لا يرسل هذا الموقع ما تدخله إلى خادم للشركة، ولا يحتفظ به بعد إعادة تحميل الصفحة. الملف الذي تنزله يبقى على جهازك.
  - heading "الاتصال وروابط الخارج" [level=2]
  - paragraph: عند فتح WhatsApp أو الاتصال هاتفيًا تنتقل إلى الخدمة المختارة؛ تنطبق سياساتها على استخدامك لها. شارك فقط المعلومات اللازمة لبدء النقاش، وتجنب إرسال أسرار أو بيانات حساسة في الملخص الأولي.
  - heading "الاستضافة" [level=2]
  - paragraph:
    - text: الموقع مستضاف على GitHub Pages. قد يعالج مزود الاستضافة معلومات الاتصال التقنية وفق سياسته. لا نضيف أدوات إعلانات أو تحليلات إلى هذه النسخة، والخطوط مستضافة مع الموقع.
    - link "سياسة خصوصية GitHub":
      - /url: https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement
