- main:
  - text: HOW WE WORK
  - heading "من سؤال العمل. إلى تسليم واضح." [level=1]
  - paragraph: منهج تعاون يجمع الإدارة والعمليات والتقنية حول نطاق واحد ومخرجات قابلة للمراجعة.
  - article:
    - text: /\d+ \/ الاكتشاف/
    - heading "نفهم القرار قبل النظام." [level=2]
    - paragraph: نجتمع مع أصحاب المصلحة لفهم سير العمل والمستخدمين والقيود والتكاملات.
    - strong: "المخرج:"
    - paragraph: ملخص احتياج، خريطة عمليات، قائمة متطلبات وأولويات.
  - article:
    - text: /\d+ \/ النطاق والتصميم/
    - heading "ما سندخله في الإصدار الأول." [level=2]
    - paragraph: نحدد الحدود ونصمم الرحلات والنموذج ونراجع الاعتماديات والميزانية والجدول.
    - strong: "المخرج:"
    - paragraph: عرض فني ومالي، نموذج واجهات، معايير قبول واعتماد بدء.
  - article:
    - text: /\d+ \/ التطوير والمراجعة/
    - heading "تقدم ظاهر في كل مرحلة." [level=2]
    - paragraph: نبني على مراحل ونراجع المنتج مع المسؤول المعين. نسجل القرارات والتغييرات ونختبر السيناريوهات.
    - strong: "المخرج:"
    - paragraph: نسخ مرحلية، سجل تغييرات، اختبارات وتقارير تقدم.
  - article:
    - text: /\d+ \/ قبول المستخدم والإطلاق/
    - heading "تشغيل بخطة انتقال." [level=2]
    - paragraph: يجرب فريقك سيناريوهات العمل المتفق عليها. نعالج الملاحظات ونراجع الترحيل والتراجع والصلاحيات.
    - strong: "المخرج:"
    - paragraph: محضر قبول، خطة إطلاق، دليل تشغيل وتدريب حسب النطاق.
  - article:
    - text: /\d+ \/ التسليم والدعم/
    - heading "ملكية ومسؤوليات واضحة." [level=2]
    - paragraph: نسلّم المستودعات والوثائق والحسابات المشمولة بالاتفاق ونحدد متابعة ما بعد الإطلاق.
    - strong: "المخرج:"
    - paragraph: سجل تسليم، تفاصيل الدعم والصيانة، خطة تحسينات لاحقة.
  - article:
    - heading "إدارة التغيير" [level=3]
    - paragraph: كل طلب خارج النطاق يُوثق، ويُقيّم أثره على الوقت والتكلفة، ثم يعتمد قبل إضافته.
  - article:
    - heading "التعامل مع البيانات" [level=3]
    - paragraph: نحدد تصنيف البيانات وبيئات العمل وصلاحيات الوصول ومتطلبات الاستضافة مع فريقك. اشتراطات القطاع جزء من الاكتشاف.
  - article:
    - heading "التواصل والحوكمة" [level=3]
    - paragraph: مسؤول اتصال لدى كل طرف، اجتماعات مراجعة متفق عليها، وسجل للقرارات والمخاطر والاعتماديات.
  - heading "نبدأ من تحدّي العمل." [level=2]
  - paragraph: شاركنا الإجراء الحالي، الفرق المعنية، والنتيجة المطلوبة. منها نحدد الخطوة المناسبة.
