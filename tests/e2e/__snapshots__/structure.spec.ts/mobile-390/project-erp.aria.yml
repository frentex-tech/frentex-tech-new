  - text: ERP CONCEPT / INVENTORY
  - heading "رصيد — المخزون والمشتريات. في مسار مترابط." [level=1]
  - paragraph: تصور لوحدة مصغرة من نظام أعمال، يعرض الكميات والتنبيهات ويتيح تجربة دورة طلب شراء حتى استلامه.
  - text: نموذج أصلي لهذه النسخة / بيانات تجريبية ما صمّمناه وحدة مخزون ومشتريات مصغرة ما يمكنك تجربته طلب شراء واستلام تجريبي دورنا في النموذج تصميم التجربة والواجهة وتطوير التفاعل
  - heading "رصيد / جرّب النموذج" [level=2]
  - text: بيانات تجريبية محلية تعود للحالة الأصلية عند إعادة التحميل أنشئ طلب شراء، ثم جرّب استلامه لتحديث المخزون.
  - button "إعادة النموذج"
  - table:
