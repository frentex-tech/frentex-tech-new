  - heading "طلبات الشراء التجريبية" [level=3]
  - paragraph: لا توجد طلبات شراء. ابدأ بصنف من الجدول.
  - status
  - paragraph: هذا نموذج لوحدة داخل ERP وليس نظام ERP مكتملًا. لا توجد محاسبة أو موردون حقيقيون أو مدفوعات. البيانات مؤقتة داخل الصفحة.
  - text: التحدي
  - heading "لماذا هذا النموذج؟" [level=2]
  - paragraph: قرارات الشراء تحتاج معرفة ما هو متاح، وما اقترب من النفاد، وما تم طلبه بالفعل. صممنا رصيد ليجعل هذه الحالات قابلة للفهم في شاشة واحدة.
  - text: فكرة الحل
  - heading "تفاصيل تُسهّل العمل." [level=2]
  - paragraph: جدول مخزون مع حد إعادة طلب واضح. ينشئ المستخدم طلب شراء بكمية محددة، ثم يحاكي الاستلام لتحديث الرصيد. الطلب المفتوح يمنع التكرار على الصنف نفسه.
  - text: ما نفذناه هنا
  - heading "تجربة قابلة للاستكشاف." [level=2]
  - list:
    - listitem: ثلاثة أصناف بحدود إعادة طلب مختلفة.
    - listitem: التحقق من كمية الشراء ومنع الطلب المكرر المفتوح.
    - listitem: استلام تجريبي يحدّث المخزون وحالته مباشرة.
  - text: من النموذج إلى منتج
  - paragraph: يتطلب المنتج الفعلي تحديد متطلبات العمل، الحسابات والصلاحيات، تخزين البيانات، التكاملات، والاختبار مع مستخدمين حقيقيين. نحدّد هذا النطاق قبل الالتزام بالتنفيذ.
  - text: النموذج التالي
