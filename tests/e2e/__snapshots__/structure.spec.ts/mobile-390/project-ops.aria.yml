  - heading "لماذا هذا النموذج؟" [level=2]
  - paragraph: الطلب يصل في رسالة، ثم يُعاد إرساله إلى شخص آخر، وتضيع معرفة المسؤول والحالة. سير يستكشف مساحة واحدة تجمع تفاصيل الطلب والقرار المتعلق به.
  - text: فكرة الحل
  - heading "تفاصيل تُسهّل العمل." [level=2]
  - paragraph: قائمة طلبات واضحة وتفاصيل في مكان واحد. يمكن للمراجع اعتماد الطلب أو إعادته للاستكمال، وتظهر النتيجة في الحالة وسجل النشاط دون غموض.
  - text: ما نفذناه هنا
