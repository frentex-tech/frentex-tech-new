  - tabpanel "Customer management":
    - text: CRM / SALES EXPERIENCE
    - heading "The sales journey, in one view." [level=3]
    - paragraph: A concept for a customer relationship management system that helps the team see opportunities, know the next step and move each opportunity along a clear pipeline.
    - list:
      - listitem: ✓Designed for Arabic right-to-left reading, and available in English.
      - listitem: ✓Instant search across opportunities, and moving them forward or back.
      - listitem: ✓Live opportunity counts for each stage, and messages that confirm each action.
    - link "Explore Madar, the sales pipeline demo":
      - /url: /en/project?project=crm
    - text: Madar ● ● ● Illustrative demos with sample data, not client projects.
