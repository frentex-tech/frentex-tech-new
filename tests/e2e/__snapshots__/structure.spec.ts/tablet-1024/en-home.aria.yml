  - text: About Frentex
  - heading "Close to your context. Precise in the details." [level=2]:
    - text: ""
    - emphasis: Precise in the details.
  - paragraph: "Frentex Tech is a software company in Saudi Arabia that combines experience design and software engineering around one idea: every part of your technology should work together, in service of your business."
  - paragraph: We care about what users see and about what happens behind the interface. We choose the solution based on your needs, and we keep implementation decisions and stage deliverables clear and open to discussion.
  - link "More about Frentex":
    - /url: /en/about
  - text: Arabic at the heart of the experience Arabic is part of the experience Right-sized solutions How we think Clarity in delivery Trust in the details Frentex Lab
  - heading "See the idea. Then try it yourself." [level=2]
  - paragraph: Original demos we designed and built for this website. Each one explains a problem and a solution, and lets you try part of the user journey.
