  - text: CLIENT PRESENTATION / REFERENCES
  - heading "What inspired our approach?" [level=1]
  - paragraph: References for presenting business services and delivery. We took their principles of clarity and content structure, and developed Frentex Tech's own design and original demos.
  - article:
    - heading "Ejada" [level=2]
    - paragraph: A regional reference for presenting business solutions and service categories.
    - link "Open the reference":
      - /url: https://www.ejada.com/en/home
  - article:
    - heading "ScienceSoft" [level=2]
    - paragraph: Clarity in how delivery, stages, scope and change are managed.
    - link "Open the reference":
      - /url: https://www.scnsoft.com/software-development/about/how-we-work
  - article:
    - heading "Netguru" [level=2]
    - paragraph: How development services are organized, from discovery to maintenance.
    - link "Open the reference":
      - /url: https://www.netguru.com/services/web-development
  - article:
    - heading "thoughtbot" [level=2]
    - paragraph: Starting a product by understanding the user, the problem and the need.
    - link "Open the reference":
      - /url: https://thoughtbot.com/playbook/strategy/customer-discovery
  - article:
    - heading "Work & Co" [level=2]
    - paragraph: A reference for presenting work and digital products.
    - link "Open the reference":
      - /url: https://www.work.co/clients/
  - article:
