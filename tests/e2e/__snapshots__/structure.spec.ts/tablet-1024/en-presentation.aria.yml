    - paragraph: A reference for presenting brand identity and product experiences visually.
    - link "Open the reference":
      - /url: https://www.ramotion.com/work/
  - heading "How did we apply this to Frentex Tech?" [level=2]
  - paragraph: Language that speaks to the organization and the decision-maker, services with clear deliverables and boundaries, delivery stages you can review, and interactive demos that explain the solutions honestly.
  - paragraph: These references do not represent partnerships with or clients of the company. The Madar, Sayr and Raseed demos are original illustrative concepts.
