  - status
  - paragraph: All approval actions here are a local simulation. No real permissions are granted, no requests are sent and no external systems are changed. The demo does not include live AI.
  - text: The challenge
  - heading "Why this demo?" [level=2]
  - paragraph: A request arrives in a message, is forwarded to someone else, and it becomes unclear who is responsible and what its status is. Sayr explores a single space that holds the request details and the decision about it.
  - text: The solution idea
  - heading "Details that make work easier." [level=2]
  - paragraph: A clear list of requests, with the details in one place. The reviewer can approve a request or return it for completion, and the result appears in the status and the activity log without ambiguity.
  - text: What we built here
  - heading "An experience you can explore." [level=2]
  - list:
    - listitem: Three sample requests you can move between.
    - listitem: An approval path and a return-for-completion path.
    - listitem: Status updates and an activity log for each request.
  - text: From demo to product
  - paragraph: A real product requires defining business requirements, accounts and permissions, data storage, integrations and testing with real users. We define that scope before committing to implementation.
  - text: Next demo
