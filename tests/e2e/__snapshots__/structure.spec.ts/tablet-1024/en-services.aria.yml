  - heading "Three ways to start working together." [level=2]
  - article:
    - heading "Discovery and scoping" [level=3]
    - paragraph: "For ideas and requirements that are not yet settled: workshops, process maps, priorities and a plan for a release you can evaluate."
  - article:
    - heading "Defined project delivery" [level=3]
    - paragraph: "For a clear scope: stages, deliverables, acceptance criteria and pricing tied to what will be delivered."
  - article:
    - heading "Ongoing development" [level=3]
    - paragraph: "For a rolling list of improvements: working capacity, review cycles and progress reports, as set out in our agreement."
