- main:
  - text: FRENTEX / BUSINESS
  - heading "ERP & CRM systems" [level=1]
  - paragraph: Management of customers, sales, inventory, purchasing and approval workflows. Before deciding, we weigh configuring an existing product against building custom modules.
  - article:
    - heading "When does it fit?" [level=3]
    - paragraph: When sales, orders and inventory are spread across separate tools and it is hard to see who is responsible for what.
  - article:
    - heading "What can we build?" [level=3]
    - paragraph: Management of customers, sales, inventory, purchasing and approval workflows. Before deciding, we weigh configuring an existing product against building custom modules.
  - article:
    - heading "Deliverables we agree on" [level=3]
    - paragraph: Process analysis; a permissions matrix; the agreed modules; a migration plan; reports; training and handover.
  - article:
    - heading "What we define with your team first" [level=3]
    - paragraph: Your data sources and their quality, the modules you need, your current system, the owner of each process and the transition plan.
  - heading "Clarity before you commit." [level=2]
  - paragraph: The technical proposal sets out the release scope, exclusions, cost, schedule and acceptance criteria. Any additional requirement is assessed for its impact and approved before it is implemented.
  - link "See how we work":
    - /url: /en/process
  - heading "We start with the business challenge." [level=2]
  - paragraph: Tell us how the process works today, which teams are involved and the outcome you need. We'll recommend the right next step from there.
