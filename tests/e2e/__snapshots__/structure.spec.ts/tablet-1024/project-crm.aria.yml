  - heading "مدار — رحلة المبيعات، في صورة واحدة." [level=1]
  - paragraph: تصور لنظام إدارة علاقات العملاء يساعد الفريق على رؤية الفرص، معرفة الخطوة التالية، وتحريك كل فرصة عبر مسار واضح.
  - text: نموذج أصلي لهذه النسخة / بيانات تجريبية ما صمّمناه واجهة وتجربة مسار المبيعات ما يمكنك تجربته بحث ونقل الفرص بين المراحل دورنا في النموذج تصميم التجربة والواجهة وتطوير التفاعل
