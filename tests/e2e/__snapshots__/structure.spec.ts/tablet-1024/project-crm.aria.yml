  - paragraph: النموذج يعمل ببيانات تجريبية داخل الصفحة. لا توجد قاعدة بيانات أو حسابات أو رسائل للعملاء. إعادة التحميل تعيد الحالة الأصلية.
  - text: التحدي
  - heading "لماذا هذا النموذج؟" [level=2]
  - paragraph: عندما تنتقل متابعة العملاء بين محادثات وجداول منفصلة، يصعب معرفة ما الذي ينتظر ردًا، وما الذي وصل إلى اتفاق. صممنا مدار ليجعل حالة الفرصة والخطوة التالية ظاهرتين للفريق.
  - text: فكرة الحل
  - heading "تفاصيل تُسهّل العمل." [level=2]
  - paragraph: "لوحة بثلاث مراحل بسيطة: فرصة جديدة، عرض مرسل، وتم الاتفاق. لكل بطاقة عنوان ونشاط تالٍ. البحث يقلل التشتيت، وتحريك البطاقة يوضح تغير الحالة مباشرة."
  - text: ما نفذناه هنا
  - heading "تجربة قابلة للاستكشاف." [level=2]
  - list:
    - listitem: تصميم عربي يدعم اتجاه القراءة من اليمين إلى اليسار.
    - listitem: بحث فوري في الفرص وتحريكها للأمام أو الخلف.
    - listitem: تحديث عدد الفرص في كل مرحلة ورسائل تؤكد الإجراء.
  - text: من النموذج إلى منتج
  - paragraph: يتطلب المنتج الفعلي تحديد متطلبات العمل، الحسابات والصلاحيات، تخزين البيانات، التكاملات، والاختبار مع مستخدمين حقيقيين. نحدّد هذا النطاق قبل الالتزام بالتنفيذ.
